name: Facebook AutoBot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Job to run"
        required: true
        default: "post"
        type: choice
        options:
          - post
          - reply
          - finance
          - philosophy
          - summary
          - veo
          - recipe
          - fun
          - video

  schedule:
    # News posts: 08:30, 10:30, 12:30, 14:30, 15:30 Vietnam time (UTC+7)
    - cron: "30 1 * * *"
    - cron: "30 3 * * *"
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"

    # Philosophy: 09:00 Vietnam time
    - cron: "0 2 * * *"

    # Finance: 11:00 Vietnam time
    - cron: "0 4 * * *"

    # Recipe: 16:00 Vietnam time
    - cron: "0 9 * * *"

    # Fun/entertainment: 20:00 Vietnam time
    - cron: "0 13 * * *"

    # Reply to comments every 2 hours: 08:15, 10:15, ..., 22:15 Vietnam time
    - cron: "15 1-15/2 * * *"

    # Daily summary: 21:30 Vietnam time
    - cron: "30 14 * * *"

    # Video: 09:30, 12:45, 17:30, 21:00 Vietnam time
    - cron: "30 2 * * *"
    - cron: "45 5 * * *"
    - cron: "30 10 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: read

concurrency:
  group: facebook-autobot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Ho_Chi_Minh
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BLACKLIST_WORDS: ${{ secrets.BLACKLIST_WORDS }}
      AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select bot action
        id: select_action
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ACTION="${{ inputs.action }}"
          else
            case "${{ github.event.schedule }}" in
              "30 1 * * *"|"30 3 * * *"|"30 5 * * *"|"30 7 * * *"|"30 8 * * *") ACTION="post" ;;
              "0 2 * * *") ACTION="philosophy" ;;
              "0 4 * * *") ACTION="finance" ;;
              "0 9 * * *") ACTION="recipe" ;;
              "0 13 * * *") ACTION="fun" ;;
              "15 1-15/2 * * *") ACTION="reply" ;;
              "30 14 * * *") ACTION="summary" ;;
              "30 2 * * *"|"45 5 * * *"|"30 10 * * *"|"0 14 * * *") ACTION="video" ;;
              *)
                echo "Unknown schedule: ${{ github.event.schedule }}"
                exit 1
                ;;
            esac
          fi

          echo "Selected action: $ACTION"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Run video bot
        if: steps.select_action.outputs.action == 'video'
        run: python autobotvideo.py run

      - name: Run text/image bot
        if: steps.select_action.outputs.action != 'video'
        run: python runner.py "${{ steps.select_action.outputs.action }}"
