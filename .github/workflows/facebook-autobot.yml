name: Facebook AutoBot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Job to run"
        required: true
        default: "post"
        type: choice
        options:
          - post
          - reply
          - finance
          - philosophy
          - summary
          - veo
          - recipe
          - fun
          - video
          - health

  schedule:
    # Daily dependency health check: 07:17 Vietnam time (UTC+7)
    - cron: "17 0 * * *"

    # News posts: 08:30, 11:30, 14:30, 18:30 Vietnam time (UTC+7)
    - cron: "30 1 * * *"
    - cron: "30 4 * * *"
    - cron: "30 7 * * *"
    - cron: "30 11 * * *"

    # Reply to comments: 08:15, 14:15, 20:15 Vietnam time
    - cron: "15 1 * * *"
    - cron: "15 7 * * *"
    - cron: "15 13 * * *"

    # Philosophy: 09:07 Vietnam time
    - cron: "7 2 * * *"

    # Finance: 11:07 Vietnam time
    - cron: "7 4 * * *"

    # Fun/entertainment: 13:30 and 20:07 Vietnam time
    - cron: "30 6 * * *"
    - cron: "7 13 * * *"

    # Recipe: 16:07 Vietnam time
    - cron: "7 9 * * *"

    # Video: 09:30, 12:45, 17:30, 21:07 Vietnam time
    - cron: "30 2 * * *"
    - cron: "45 5 * * *"
    - cron: "30 10 * * *"
    - cron: "7 14 * * *"

    # Daily summary: 21:30 Vietnam time
    - cron: "30 14 * * *"

permissions:
  contents: read

concurrency:
  group: facebook-autobot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Ho_Chi_Minh
      SCHEDULED_CRON: ${{ github.event.schedule }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BLACKLIST_WORDS: ${{ secrets.BLACKLIST_WORDS }}
      AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select bot action
        id: select_action
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ACTION="${{ inputs.action }}"
          else
            case "${{ github.event.schedule }}" in
              "17 0 * * *") ACTION="health" ;;
              "30 1 * * *"|"30 4 * * *"|"30 7 * * *"|"30 11 * * *") ACTION="post" ;;
              "15 1 * * *"|"15 7 * * *"|"15 13 * * *") ACTION="reply" ;;
              "7 2 * * *") ACTION="philosophy" ;;
              "7 4 * * *") ACTION="finance" ;;
              "30 6 * * *"|"7 13 * * *") ACTION="fun" ;;
              "7 9 * * *") ACTION="recipe" ;;
              "30 2 * * *"|"45 5 * * *"|"30 10 * * *"|"7 14 * * *") ACTION="video" ;;
              "30 14 * * *") ACTION="summary" ;;
              *)
                echo "Unknown schedule: ${{ github.event.schedule }}"
                exit 1
                ;;
            esac
          fi

          echo "Selected action: $ACTION"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Run bot action
        run: python hardening_runner.py "${{ steps.select_action.outputs.action }}"
