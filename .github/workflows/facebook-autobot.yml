name: Facebook AutoBot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Job to run"
        required: true
        default: "post"
        type: choice
        options:
          - post
          - reply
          - finance
          - philosophy
          - summary
          - veo
          - recipe
          - fun

  schedule:
    # News posts: 08:30, 10:30, 12:30, 14:30, 15:30 Vietnam time (UTC+7)
    - cron: "30 1 * * *"
    - cron: "30 3 * * *"
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"

    # Philosophy: 09:00 Vietnam time
    - cron: "0 2 * * *"

    # Finance: 11:00 Vietnam time
    - cron: "0 4 * * *"

    # Reply to comments: every hour from 08:15 through 22:15 Vietnam time
    - cron: "15 1-15 * * *"

    # Daily summary: 21:30 Vietnam time
    - cron: "30 14 * * *"

permissions:
  contents: read

concurrency:
  group: facebook-autobot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Ho_Chi_Minh
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BLACKLIST_WORDS: ${{ secrets.BLACKLIST_WORDS }}
      AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select bot action
        id: select_action
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ACTION="${{ inputs.action }}"
          else
            case "${{ github.event.schedule }}" in
              "30 1 * * *"|"30 3 * * *"|"30 5 * * *"|"30 7 * * *"|"30 8 * * *")
                ACTION="post"
                ;;
              "0 2 * * *")
                ACTION="philosophy"
                ;;
              "0 4 * * *")
                ACTION="finance"
                ;;
              "15 1-15 * * *")
                ACTION="reply"
                ;;
              "30 14 * * *")
                ACTION="summary"
                ;;
              *)
                echo "Unknown schedule: ${{ github.event.schedule }}"
                exit 1
                ;;
            esac
          fi

          echo "Selected action: $ACTION"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Run bot
        run: python autobot.py "${{ steps.select_action.outputs.action }}"
