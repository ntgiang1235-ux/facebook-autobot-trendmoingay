name: Facebook AutoBot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Job to run"
        required: true
        default: "post"
        type: choice
        options:
          - post
          - reply
          - finance
          - philosophy
          - summary
          - veo
          - recipe
          - fun

  schedule:
    - cron: "30 1 * * *"   # 08:30 Vietnam
    - cron: "30 3 * * *"   # 10:30 Vietnam
    - cron: "30 5 * * *"   # 12:30 Vietnam
    - cron: "30 7 * * *"   # 14:30 Vietnam
    - cron: "30 8 * * *"   # 15:30 Vietnam

permissions:
  contents: read

concurrency:
  group: facebook-autobot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Ho_Chi_Minh
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BLACKLIST_WORDS: ${{ secrets.BLACKLIST_WORDS }}
      AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run scheduled post
        if: github.event_name == 'schedule'
        run: python autobot.py post
      - name: Run manual action
        if: github.event_name == 'workflow_dispatch'
        run: python autobot.py "${{ inputs.action }}"
