name: Facebook AutoBot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Job to run"
        required: true
        default: "post"
        type: choice
        options:
          - post
          - reply
          - finance
          - philosophy
          - summary
          - veo
          - recipe
          - fun
          - video
          - health
          - metrics
          - learn
          - strategy_guard
          - style_evolve
          - planner
          - dispatch
          - report_daily
          - report_weekly

  schedule:
    # Daily dependency health check: 07:17 Vietnam time (UTC+7)
    - cron: "17 0 * * *"

    # Refresh adaptive learning from mature metrics before planning the day.
    - cron: "27 0 * * *"

    # Guard the new strategy against mature 7-day performance regression.
    - cron: "32 0 * * *"

    # Evolve at most one controlled style experiment weekly before planning.
    - cron: "37 0 * * 0"

    # Build today's adaptive content plan after health/learning/guard, before first slot.
    - cron: "47 0 * * *"

    # Adaptive dispatcher. GitHub only wakes the bot; Turso daily_plan decides
    # whether a content slot is actually due. :07/:37 avoids top-of-hour load.
    - cron: "7,37 * * * *"

    # Reply to comments: 08:15, 14:15, 20:15 Vietnam time.
    - cron: "15 1 * * *"
    - cron: "15 7 * * *"
    - cron: "15 13 * * *"

    # Metrics collector: four snapshots/check windows per day.
    - cron: "17 3 * * *"
    - cron: "17 9 * * *"
    - cron: "17 15 * * *"
    - cron: "17 21 * * *"

    # Daily summary: 21:30 Vietnam time.
    - cron: "30 14 * * *"

    # Compact Telegram performance brief: 21:47 Vietnam time.
    - cron: "47 14 * * *"

    # Deeper Telegram strategy report: Sunday 21:57 Vietnam time.
    - cron: "57 14 * * 0"

permissions:
  contents: read

concurrency:
  group: facebook-autobot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Ho_Chi_Minh
      SCHEDULED_CRON: ${{ github.event.schedule }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BLACKLIST_WORDS: ${{ secrets.BLACKLIST_WORDS }}
      AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select bot action
        id: select_action
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ACTION="${{ inputs.action }}"
          else
            case "${{ github.event.schedule }}" in
              "17 0 * * *") ACTION="health" ;;
              "27 0 * * *") ACTION="learn" ;;
              "32 0 * * *") ACTION="strategy_guard" ;;
              "37 0 * * 0") ACTION="style_evolve" ;;
              "47 0 * * *") ACTION="planner" ;;
              "7,37 * * * *") ACTION="dispatch" ;;
              "15 1 * * *") ACTION="reply" ;;
              "15 7 * * *") ACTION="reply" ;;
              "15 13 * * *") ACTION="reply" ;;
              "17 3 * * *") ACTION="metrics" ;;
              "17 9 * * *") ACTION="metrics" ;;
              "17 15 * * *") ACTION="metrics" ;;
              "17 21 * * *") ACTION="metrics" ;;
              "30 14 * * *") ACTION="summary" ;;
              "47 14 * * *") ACTION="report_daily" ;;
              "57 14 * * 0") ACTION="report_weekly" ;;
              *)
                echo "Unknown schedule: ${{ github.event.schedule }}"
                exit 1
                ;;
            esac
          fi

          echo "Selected action: $ACTION"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Run bot action
        run: python hardening_runner.py "${{ steps.select_action.outputs.action }}"
