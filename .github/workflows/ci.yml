name: CI

on:
  push:
    branches:
      - main
      - codex/hardening-reliability
      - codex/hardening-2
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q .

  patch_legacy_tls:
    if: github.ref == 'refs/heads/codex/hardening-2' && github.event.head_commit.message == 'ci: patch legacy tls'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/hardening-2
          fetch-depth: 0

      - name: Remove legacy TLS bypass
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('autobot.py')
          text = path.read_text(encoding='utf-8')
          expected = {
              'import urllib3\n': 1,
              'urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)\n': 1,
              ', verify=False': 2,
          }
          for needle, count in expected.items():
              actual = text.count(needle)
              if actual != count:
                  raise SystemExit(f'Expected {count} occurrences of {needle!r}, found {actual}')
          text = text.replace('import urllib3\n', '')
          text = text.replace('urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)\n', '')
          text = text.replace(', verify=False', '')
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autobot.py
          git commit -m "fix: remove legacy TLS bypass"
          git push origin HEAD:codex/hardening-2
